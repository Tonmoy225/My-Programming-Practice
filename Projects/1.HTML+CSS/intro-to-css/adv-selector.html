<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance selectors</title>
    <style>
        /* Tag selector */
        p {
            color: red;
        }
        .red{
            color:red;
        }
        .green{
            color:green;
        }
        .bold{
            font-weight: bold;
        }
        .green.bold{
            font-size:50px;
        }
        li , ul , ol , h1{
            font-family: 'Courier New', Courier, monospace;
        }
        article > p{
            color:blue
        }


    </style>
</head>

<body>
    <h1>
        This is a Heading 1
    </h1>
<ol>
    <li class="red">This is a List Item</li>
    <li class="red bold">This is a List Item</li>
    <li class="green">This is a List Item</li>
    <li class="bold green">This is a List Item</li>       
    </ol>

    <ul>
        <li class="bold">This is a List Item </li>
        <li>This is a List Item </li>
        <li>This is a List Item </li>
        <li>This is a List Item </li>
    </ul>
    <article>
        <h1>
            hello mcu
        </h1>
        <p>lore ipsum ygkgkjlholjkuk.guukhhljk.n  hiil;ok huk.h lhukgukhl</p>
    
    </article>
</body>

</html>
